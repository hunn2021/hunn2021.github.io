<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: #f5f6f8;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #1a1a1a;
    }
    .app {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #e8e8e8;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar h1 {
      font-size: 1.3rem;
      font-weight: 450;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .sidebar label {
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }
    .sidebar select {
      width: 100%;
      background: #f5f5f5;
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: #1a1a1a;
      cursor: pointer;
      outline: none;
      font-family: inherit;
    }
    .sidebar select:focus {
      border-color: #888;
      background: white;
    }
    .sidebar input {
      width: 100%;
      background: #f5f5f5;
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }
    .sidebar input:focus {
      border-color: #888;
      background: white;
    }
    .sidebar input::placeholder {
      color: #b0b0b0;
      font-weight: 300;
    }
    .sidebar .status-text {
      font-size: 0.7rem;
      color: #888;
      padding: 4px 0;
      border-top: 1px solid #f0f0f0;
      margin-top: auto;
    }
    .sidebar .api-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar .api-group .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .sidebar .api-group .row input {
      flex: 1;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f9fafb;
      min-width: 0;
    }
    .chat-box {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }
    .chat-box .user {
      align-self: flex-end;
      background: #eaeaea;
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      max-width: 75%;
      font-size: 0.95rem;
    }
    .chat-box .ai {
      align-self: flex-start;
      background: white;
      border: 1px solid #e2e2e2;
      padding: 10px 16px;
      border-radius: 18px 18px 18px 4px;
      max-width: 75%;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px 20px 16px;
      background: white;
      border-top: 1px solid #e8e8e8;
      flex-shrink: 0;
    }
    .input-area textarea {
      flex: 1;
      background: #f5f5f5;
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.9rem;
      resize: none;
      height: 46px;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
    }
    .input-area textarea:focus {
      border-color: #888;
      background: white;
    }
    .input-area button {
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 24px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 450;
      flex-shrink: 0;
      transition: 0.1s;
    }
    .input-area button:hover { background: #333; }
    .input-area button:active { background: #000; }
    @media (max-width: 640px) {
      .sidebar { width: 180px; padding: 14px 12px; }
      .sidebar h1 { font-size: 1.1rem; }
      .chat-box { padding: 14px 16px; }
      .input-area { padding: 10px 14px 14px; }
      .input-area button { padding: 0 16px; font-size: 0.8rem; }
      .chat-box .user, .chat-box .ai { max-width: 90%; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>AI Chat</h1>
    <div class="api-group">
      <label>选择模型</label>
      <select id="mode">
        <option value="pollinations">Pollinations</option>
        <option value="openrouter">OpenRouter</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="groq">Groq</option>
        <option value="mistral">Mistral</option>
        <option value="cohere">Cohere</option>
        <option value="anthropic">Anthropic</option>
        <option value="google">Gemini</option>
        <option value="perplexity">Perplexity</option>
        <option value="together">Together</option>
        <option value="fireworks">Fireworks</option>
      </select>
    </div>
    <div class="api-group">
      <label>API Key</label>
      <input id="key" type="text" placeholder="Pollinations 留空" autocomplete="off">
    </div>
    <div class="status-text" id="status">就绪</div>
  </div>

  <div class="main">
    <div class="chat-box" id="chat"></div>
    <div class="input-area">
      <textarea id="msg" placeholder="输入消息…" rows="1"></textarea>
      <button onclick="send()">发送</button>
    </div>
  </div>
</div>

<script>
  (function(){
    const chat = document.getElementById('chat');
    const statusEl = document.getElementById('status');

    function addMsg(text, type) {
      const div = document.createElement('div');
      div.className = type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function pollinations(text) {
      const r = await fetch('https://text.pollinations.ai/' + encodeURIComponent(text), {
        signal: AbortSignal.timeout(14000)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    }

    async function openrouter(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 OpenRouter Key');
      const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'openrouter/free', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    async function openai(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 OpenAI Key');
      const r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'gpt-4o-mini', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    async function deepseek(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 DeepSeek Key');
      const r = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    async function groq(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Groq Key');
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'mixtral-8x7b-32768', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    async function mistral(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Mistral Key');
      const r = await fetch('https://api.mistral.ai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'mistral-tiny', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    async function cohere(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Cohere Key');
      const r = await fetch('https://api.cohere.ai/v1/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'command-r', message: text })
      });
      const j = await r.json();
      if (j.message) throw new Error(j.message);
      if (j.text) return j.text;
      throw new Error('未知响应');
    }

    async function anthropic(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Anthropic Key');
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model: 'claude-3-haiku-20240307', max_tokens: 1024, messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.content[0].text;
    }

    async function google(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Gemini Key');
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=' + key, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.candidates[0].content.parts[0].text;
    }

    async function perplexity(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Perplexity Key');
      const r = await fetch('https://api.perplexity.ai/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'llama-3-sonar-small-online', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    async function together(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Together Key');
      const r = await fetch('https://api.together.xyz/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'meta-llama/Llama-3-8b-chat-hf', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    async function fireworks(text) {
      const key = document.getElementById('key').value.trim();
      if (!key) throw new Error('需要 Fireworks Key');
      const r = await fetch('https://api.fireworks.ai/inference/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'accounts/fireworks/models/llama-v3-8b-instruct', messages: [{ role: 'user', content: text }] })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.choices[0].message.content;
    }

    window.send = async function() {
      const text = document.getElementById('msg').value.trim();
      if (!text) return;
      addMsg(text, 'user');
      document.getElementById('msg').value = '';
      statusEl.innerText = '请求中…';
      const mode = document.getElementById('mode').value;
      try {
        let res = '';
        switch (mode) {
          case 'pollinations': res = await pollinations(text); break;
          case 'openrouter': res = await openrouter(text); break;
          case 'openai': res = await openai(text); break;
          case 'deepseek': res = await deepseek(text); break;
          case 'groq': res = await groq(text); break;
          case 'mistral': res = await mistral(text); break;
          case 'cohere': res = await cohere(text); break;
          case 'anthropic': res = await anthropic(text); break;
          case 'google': res = await google(text); break;
          case 'perplexity': res = await perplexity(text); break;
          case 'together': res = await together(text); break;
          case 'fireworks': res = await fireworks(text); break;
          default: throw new Error('未知模式');
        }
        addMsg(res, 'ai');
        statusEl.innerText = '完成';
      } catch (e) {
        addMsg('错误: ' + e.message, 'ai');
        statusEl.innerText = '失败';
      }
    };

    document.getElementById('msg').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        window.send();
      }
    });
  })();
</script>
</body>
</html>
