<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUNN's SPACE</title>

<style>
:root{
  --bg:#ffffff;
  --text:#111;
  --accent:#333333;
  --border:#ccc;
}

[data-theme="dark"]{
  --bg:#0d0d0d;
  --text:#eee;
  --accent:#555555;
  --border:#444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  transition: background 0.3s, color 0.3s;
}

#app{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.section{
  height:100vh;
  scroll-snap-align:start;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.footer-section {
  height: 60px;
  min-height: 60px;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  font-size: 14px;
  letter-spacing: 0.5px;
  color: var(--text);
  opacity: 0.6;
  border-top: 1px solid var(--border);
  background: var(--bg);
  transition: opacity 0.3s;
}
.footer-section a {
  color: var(--text);
  text-decoration: none;
  transition: opacity 0.2s;
}
.footer-section a:hover {
  opacity: 0.4;
  text-decoration: underline;
}

h1{
  font-size:4vw;
  letter-spacing:2px;
}

.btn{
  margin-top:20px;
  padding:10px 20px;
  border:1px solid var(--text);
  cursor:pointer;
  transition: background 0.3s, color 0.3s;
}
.btn:hover{
  background:var(--text);
  color:var(--bg);
}

.mode-control {
  position: fixed;
  right: 35px;
  top: 30px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11px;
  letter-spacing: 4px;
  cursor: pointer;
  opacity: .65;
  transition: opacity .3s;
  z-index: 2147483647;
  pointer-events: auto;
  background: #e0e0e0;
  padding: 6px 14px;
  border-radius: 30px;
}

[data-theme="dark"] .mode-control {
  background: #2a2a2a;
}

.mode-control:hover{
  opacity:1;
}

.mode-point{
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
  position:relative;
  transition: transform .5s, background .5s;
}

.mode-point::after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  background:currentColor;
  opacity:.15;
  filter:blur(6px);
  transition: opacity .5s, transform .5s;
}

[data-theme="dark"] .mode-point{
  transform:scale(1.4);
}

[data-theme="dark"] .mode-point::after{
  opacity:.35;
}

#projects {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: 40px;
  background: var(--bg);
  color: var(--text);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  z-index: 9998;
}

#projects::before {
  content: "";
  position: absolute;
  inset: 0;
  background: #ffffff;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  z-index: -1;
}

[data-theme="dark"] #projects::before {
  background: #0d0d0d;
}

#projects::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #0d0d0d;
  clip-path: polygon(100% 0, 100% 100%, 0 100%, 100% 0);
  z-index: -1;
}

[data-theme="dark"] #projects::after {
  background: #ffffff;
}

#projects .back,
#projects h1,
.project-item {
  position: relative;
  z-index: 1;
}

.back {
  font-size: 1.2rem;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-bottom: 20px;
  align-self: flex-start;
  color: var(--text);
}
.back:hover {
  opacity: 0.5;
}

.project-item {
  font-size: 2rem;
  margin: 12px 0;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.2s;
  color: var(--text);
}
.project-item:hover {
  opacity: 0.5;
  transform: translateX(8px);
}
.project-item:active {
  opacity: 0.2;
  transform: scale(0.98);
}

.hardware-section {
  position: relative;
  overflow: hidden;
}

#particleCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.45;
  z-index: 0;
}

.hw {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
}

.hw-item{
  min-width: 140px;  
  width: auto;      
  padding: 18px 22px;
  height: 100px;    
  border-radius:22px;
  background: rgba(255,255,255,0.35);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.25);
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
  transition: transform 0.15s ease, box-shadow 0.3s;
  display: flex;         
  flex-direction: column;
  justify-content: center; 
  align-items: flex-start;
  flex-shrink: 0;         
}

.hw-item:hover{
  box-shadow: 0 30px 60px rgba(0,0,0,0.15);
}

[data-theme="dark"] .hw-item{
 background: rgba(255,255,255,0.06);
 border-color: rgba(255,255,255,0.12);
}

.label{
  font-size:10px;
  letter-spacing:3px;
  opacity:0.45;
}

.value{
  display:block;
  margin-top:12px;
  font-size:13px;
  font-family: 'Inter', sans-serif;
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.section p{
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 18px;
  letter-spacing: 1px;
  opacity: 0.7;
}

#app::-webkit-scrollbar {
  width: 0;
  height: 0;
  background: transparent;
}
#app {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.scroll-hint {
  position: absolute;
  bottom: 40px;              
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;               
  transition: opacity 1s ease;
  color: var(--text);
  font-size: 12px;
  letter-spacing: 2px;
}

.scroll-hint.show {
  opacity: 0.6;             
}

.scroll-arrow {
  display: block;
  width: 20px;
  height: 20px;
  border-right: 2px solid var(--text);
  border-bottom: 2px solid var(--text);
  transform: rotate(45deg);
  animation: bounce-down 1.8s infinite ease-in-out;
}

@keyframes bounce-down {
  0%, 100% {
    transform: rotate(45deg) translate(0, 0);
    opacity: 0.3;
  }
  50% {
    transform: rotate(45deg) translate(6px, 6px);
    opacity: 1;
  }
}

.scroll-text {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.5;
  font-weight: 300;
}

.section:first-of-type {
  position: relative;
}
</style>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230d0d0d' rx='24'/%3E%3Ctext x='50' y='72' font-family='Arial, sans-serif' font-size='64' font-weight='600' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

</head>
<body>

<div class="mode-control" id="themeBtn">
    <span id="modeText">LIGHT</span>
    <span class="mode-point"></span>
</div>

<div id="app">

  <section class="section">
    <h1>HELLO</h1>
    <p>HUNN的个人空间</p>
  <div class="scroll-hint" id="scrollHint">
    <span class="scroll-arrow"></span>
    <span class="scroll-text"></span>
  </div>
  </section>

  <section class="section">
    <h1>ABOUT</h1>
    <p>不堆信息，只留空间</p>
  </section>

  <section class="section">
    <h1>PROJECTS</h1>
    <p>细枝末节</p>
    <div class="btn" id="openProjects">进入</div>
  </section>

  <section class="section hardware-section">
    <canvas id="particleCanvas"></canvas>
    <h1>I KNOW</h1>
    <p>YOUR HARDWARE</p>
    <div class="hw">
      <div class="hw-item">
        <span class="label">GPU</span>
        <span class="value" id="hwGpu">Detecting...</span>
      </div>
      <div class="hw-item">
        <span class="label">MEMORY</span>
        <span class="value" id="hwMem">Detecting...</span>
      </div>
      <div class="hw-item">
        <span class="label">CORES</span>
        <span class="value" id="hwCores">Detecting...</span>
      </div>
    </div>
  </section>

  <section class="footer-section">
    <span>© 2026 hunn2021</span>
    <a href="https://github.com/hunn2021">GitHub</a>
    <a href="https://space.bilibili.com/1237834848">bilibili</a>
    <a href="javascript:void(0)" id="aboutLink">关于</a>
  </section>

</div>

<div id="projects">
  <div class="back" id="backBtn">← 返回</div>
  <h1>PROJECTS</h1>
  <div class="project-item" data-project="html">HTML</div>
  <div class="project-item" data-project="canvas">Canvas 实验</div>
  <div class="project-item" data-project="svg">SVG</div>
</div>

<script>

const themeBtn = document.getElementById("themeBtn");
const modeText = document.getElementById("modeText");

function getSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(theme) {
  const isDark = theme === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  modeText.textContent = isDark ? 'DARK' : 'LIGHT';
}

let userHasToggled = false;
applyTheme(getSystemTheme());

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  if (!userHasToggled) {
    applyTheme(e.matches ? 'dark' : 'light');
  }
});

themeBtn.onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  applyTheme(dark ? 'light' : 'dark');
  userHasToggled = true;
};

const openBtn = document.getElementById("openProjects");
const projectPage = document.getElementById("projects");
const backBtn = document.getElementById("backBtn");

openBtn.onclick = () => {
  projectPage.style.display = "flex";
};

backBtn.onclick = () => {
  projectPage.style.display = "none";
};

document.querySelectorAll('.project-item').forEach(item => {
  item.addEventListener('click', function() {
    const name = this.textContent.trim();
    alert(`文件制作ing：${name}`);
  });
});

function getGPU() {
  try {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) return "Unknown GPU";
    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    let renderer;
    if (debug) {
      renderer = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
    } else {
      renderer = gl.getParameter(gl.RENDERER);
    }
    renderer = renderer.replace(/^ANGLE\s*\(/, "").replace(/\)$/, "");
    renderer = renderer.replace(/\s+(Direct3D|OpenGL|Vulkan).*$/i, "");
    renderer = renderer.replace(/\s*\(0x[0-9A-Fa-f]+\)/g, "").replace(/\s+/g, " ").trim();
    if (renderer.includes("NVIDIA")) {
      renderer = renderer.replace("NVIDIA GeForce ", "");
      return renderer;
    }
    if (renderer.includes("AMD")) {
      renderer = renderer.replace("AMD ", "");
      return renderer;
    }
    if (renderer.includes("Intel")) return renderer;
    if (renderer.includes("Apple")) return renderer;
    return renderer.substring(0, 40);
  } catch (e) {
    return "GPU Unknown";
  }
}

function updateHardware() {
  const cores = navigator.hardwareConcurrency || 'Unknown';
  const mem = navigator.deviceMemory || 'Unknown';
  const gpu = getGPU();
  document.getElementById('hwCores').textContent = cores + " cores";
  document.getElementById('hwMem').textContent = mem + " GB";
  document.getElementById('hwGpu').textContent = gpu;
}
updateHardware();

const app = document.getElementById("app");
let isScrolling = false;

app.addEventListener("wheel", (e) => {
  if (isScrolling) return;
  isScrolling = true;
  const dir = e.deltaY > 0 ? 1 : -1;
  const sections = document.querySelectorAll(".section, .footer-section");
  let current = 0;
  let minDist = Infinity;
  const scrollTop = app.scrollTop;
  sections.forEach((sec, i) => {
    const offset = sec.offsetTop;
    const dist = Math.abs(scrollTop - offset);
    if (dist < minDist) {
      minDist = dist;
      current = i;
    }
  });
  let next = Math.max(0, Math.min(sections.length - 1, current + dir));
  app.scrollTo({ top: sections[next].offsetTop, behavior: "smooth" });
  setTimeout(() => { isScrolling = false; }, 600);
}, { passive: true });

const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animationId = null;

function resizeCanvas() {
  const parent = canvas.parentElement;
  canvas.width = parent.clientWidth;
  canvas.height = parent.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initParticles(count = 80) {
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      r: Math.random() * 2 + 1,
    });
  }
}
initParticles();

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  ctx.fillStyle = isDark ? 'rgba(200, 220, 255, 0.6)' : 'rgba(30, 40, 80, 0.3)';
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function updateParticles() {
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  }
}

function animateParticles() {
  updateParticles();
  drawParticles();
  animationId = requestAnimationFrame(animateParticles);
}
animateParticles();

document.getElementById('aboutLink').addEventListener('click', function(e) {
  e.preventDefault();
  alert(
    '╭─────────────────╮\n' +
    '│  HUNN2021       │\n' +
    '│  ver:1.0        │\n' +
    '│  stat:ONLINE    │\n' +
    '│  ip:UNKNOWN     │\n' +
    '╰─────────────────╯\n' +
    '\n“The Internationale / Unites the human race.”'
  );
});

window.addEventListener('load', function() {
  setTimeout(function() {
    const hint = document.getElementById('scrollHint');
    if (hint) {
      hint.classList.add('show');
    }
  }, 3000); 
});
  
</script>

</body>
</html>
