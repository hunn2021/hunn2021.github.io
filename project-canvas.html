<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 实验 · 体素世界</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0d0d0d; }
    #info {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
    }
    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      z-index: 20;
      transition: color 0.2s;
      letter-spacing: 1px;
    }
    .back-link:hover { color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <a href="../index.html" class="back-link">← 返回</a>
  <div id="info">拖拽旋转 · 滚轮缩放 · R重置视角 · A切换自动旋转</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(18, 12, 18);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.8;
    controls.minDistance = 6;
    controls.maxDistance = 40;
    controls.target.set(0, 0, 0);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 2.5);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    const d = 25;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 50;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.6);
    fillLight.position.set(-10, 5, -10);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffaa66, 0.4);
    rimLight.position.set(-5, 0, 15);
    scene.add(rimLight);

    const gridHelper = new THREE.GridHelper(30, 20, 0x444466, 0x333355);
    gridHelper.position.y = -3.5;
    scene.add(gridHelper);

    const voxelGroup = new THREE.Group();
    const size = 7;     
    const spacing = 1.2;
    const colors = [
      0x4a90d9, 0x50c8a0, 0xe67e22, 0xe74c3c, 
      0x9b59b6, 0xf1c40f, 0x1abc9c, 0xe67e22
    ];

    function getHeight(x, z) {
      return Math.sin(x * 0.5) * Math.cos(z * 0.5) * 1.2 + 
             Math.sin(x * 1.2 + z * 0.8) * 0.6;
    }

    for (let x = -size; x <= size; x++) {
      for (let z = -size; z <= size; z++) {
        const dist = Math.sqrt(x*x + z*z);
        if (dist > size + 1) continue;
        
        const heightOffset = getHeight(x, z);
        const baseY = Math.floor(heightOffset * 1.5);
        const maxY = Math.max(1, Math.floor(3 + heightOffset * 0.8));
        
        for (let y = 0; y < maxY; y++) {
          const colorIdx = Math.floor((x + z + y * 0.5) % colors.length);
          const isSurface = (y === maxY - 1);
          const isDeep = (y < maxY * 0.3);
          
          let color;
          if (isSurface) {
            color = colors[Math.floor((x + z) % colors.length)];
          } else if (isDeep) {
            color = 0x2c3e50;
          } else {
            color = 0x34495e;
          }
          
          const material = new THREE.MeshStandardMaterial({
            color: color,
            roughness: isSurface ? 0.4 : 0.7,
            metalness: isSurface ? 0.3 : 0.1,
            emissive: isSurface ? new THREE.Color(color).multiplyScalar(0.08) : new THREE.Color(0x000000),
            emissiveIntensity: 0.1,
          });
          
          const box = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), material);
          box.position.set(x * spacing, y * spacing - 2, z * spacing);
          box.castShadow = true;
          box.receiveShadow = true;
          voxelGroup.add(box);
        }
      }
    }
    scene.add(voxelGroup);

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 800;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 60;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({
      color: 0x88aaff,
      size: 0.08,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
    });
    const stars = new THREE.Points(starGeometry, starMaterial);
    stars.position.y = 5;
    scene.add(stars);

    function animate() {
      requestAnimationFrame(animate);
      
      controls.update();
      
      stars.rotation.y += 0.0003;
      
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        camera.position.set(18, 12, 18);
        controls.target.set(0, 0, 0);
        controls.update();
      }
      if (e.key === 'a' || e.key === 'A') {
        controls.autoRotate = !controls.autoRotate;
      }
    });

    console.log('体素世界已加载！拖拽旋转 · 滚轮缩放 · R重置视角 · A切换自动旋转');
  </script>
</body>
</html>
